# golangci-lint v2 configuration.
# See https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus a
  # curated, high-value selection appropriate for a small library.
  enable:
    - copyloopvar
    - errorlint
    - exhaustive
    - gochecknoinits
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    exhaustive:
      # A switch with an explicit default case is considered exhaustive.
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
