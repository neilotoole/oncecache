name: Go

on:
  push:
  pull_request:

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        skip-cache: true
        version: ${{ env.GOLANGCI_LINT_VERSION }}

    - name: Test
      run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out -covermode=atomic -v ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        slug: neilotoole/oncecache
        # Don't fail the build on a Codecov upload hiccup (or before the
        # CODECOV_TOKEN secret is configured).
        fail_ci_if_error: false

    - name: Benchmarks (smoke)
      # Run every benchmark once under -race to verify they execute (and the
      # parallel ones stay race-free). Not a perf measurement: timings on
      # shared CI runners are too noisy to be meaningful.
      run: go test -race -run='^$' -bench=. -benchtime=1x ./...
